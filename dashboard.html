<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hyrox Training · July 5</title>
<style>
  :root {
    --bg:        #0f1117;
    --card:      #1a1d26;
    --card2:     #22263a;
    --accent:    #e8ff47;
    --accent2:   #5b8fff;
    --text:      #f0f0ef;
    --muted:     #7a7f94;
    --done:      #4cdd82;
    --skipped:   #ff6b6b;
    --border:    #2c3048;
    --red-flag:  #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; min-height: 100vh; }

  /* ── Layout ── */
  .app { max-width: 500px; margin: 0 auto; padding: 0 0 120px; }

  /* ── Header ── */
  .header { padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
  .race-countdown { font-size: 13px; color: var(--muted); }
  .race-countdown span { color: var(--accent); font-weight: 700; }
  .header-date { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .header-week { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── Week strip ── */
  .week-strip { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-divider { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 2px; }
  .week-divider span { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; writing-mode: vertical-rl; }
  .day-chip { flex-shrink: 0; width: 48px; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); transition: all .15s; }
  .day-chip .chip-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .day-chip .chip-date { font-size: 13px; font-weight: 700; }
  .day-chip .chip-icon { font-size: 15px; margin-top: 3px; }
  .day-chip.active { border-color: var(--accent); background: #1e2510; }
  .day-chip.today { border-color: var(--accent2); }
  .day-chip.done { border-color: var(--done); background: #0d2018; }
  .day-chip.skipped { border-color: var(--skipped); opacity: .6; }
  .day-chip.rest { opacity: .5; }

  /* ── Pace targets bar ── */
  .pace-bar { display: flex; gap: 6px; padding: 0 16px 12px; }
  .pace-pill { flex: 1; background: var(--card); border-radius: 8px; padding: 8px 10px; text-align: center; border: 1px solid var(--border); }
  .pace-pill .p-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pace-pill .p-val { font-size: 17px; font-weight: 800; color: var(--accent); }
  .pace-pill.adjusted .p-val { color: #ffb347; }
  .pace-pill .p-adj { font-size: 10px; color: #ffb347; }

  /* ── Session card ── */
  .session-card { margin: 0 16px 12px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
  .session-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .session-type-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .type-run    { background: #1a2e10; }
  .type-strength { background: #1a1a2e; }
  .type-sim    { background: #2e1a1a; }
  .type-rest   { background: #1a1a1a; }
  .session-title { flex: 1; }
  .session-title h2 { font-size: 16px; font-weight: 700; }
  .session-title .session-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .status-pending  { background: #2a2a3a; color: var(--muted); }
  .status-done     { background: #0d2018; color: var(--done); }
  .status-skipped  { background: #2a0f0f; color: var(--skipped); }

  /* ── Blocks ── */
  .session-body { padding: 0 16px 16px; }
  .block { margin-bottom: 14px; }
  .block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .block-title.knee-title { color: #7fb3ff; }
  .block-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 14px; line-height: 1.45; }
  .block-item::before { content: '·'; color: var(--muted); flex-shrink: 0; }
  .pace-inline { color: var(--accent); font-weight: 700; }
  .knee-note { background: #0d1829; border: 1px solid #1e3a5a; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #8bb8ff; line-height: 1.5; margin-top: 4px; }

  /* ── Complete / Skip buttons ── */
  .action-bar { display: flex; gap: 8px; padding: 14px 16px 0; border-top: 1px solid var(--border); }
  .btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all .15s; }
  .btn-complete { background: var(--accent); color: #111; }
  .btn-complete:hover { background: #d4eb3a; }
  .btn-skip { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }
  .btn-skip:hover { color: var(--skipped); border-color: var(--skipped); }
  .btn-undo { background: var(--card2); color: var(--muted); border: 1px solid var(--border); font-size: 13px; }
  .btn-feedback { background: var(--accent2); color: #fff; }
  .btn-full { width: 100%; flex: unset; }

  /* ── Feedback modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform .25s cubic-bezier(.32,0,.67,0); }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal-close { position: absolute; right: 20px; top: 20px; background: var(--card2); border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; }

  .q-block { margin-bottom: 20px; }
  .q-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: .05em; }

  .feel-row { display: flex; gap: 6px; }
  .feel-btn { flex: 1; padding: 10px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; text-align: center; transition: all .15s; }
  .feel-btn .feel-emoji { font-size: 22px; display: block; }
  .feel-btn .feel-label { font-size: 10px; color: var(--muted); margin-top: 3px; display: block; }
  .feel-btn.selected { border-color: var(--accent); background: #1e2510; }
  .feel-btn.selected .feel-label { color: var(--accent); }

  .pace-feel-row { display: flex; flex-direction: column; gap: 6px; }
  .pace-opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; font-size: 14px; transition: all .15s; }
  .pace-opt input { accent-color: var(--accent); width: 16px; height: 16px; }
  .pace-opt.selected { border-color: var(--accent); background: #1e2510; }

  .knee-scale { display: flex; gap: 6px; }
  .knee-btn { flex: 1; padding: 10px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; text-align: center; font-size: 13px; font-weight: 700; transition: all .15s; }
  .knee-btn.selected { border-color: #5b8fff; background: #0d1829; color: #5b8fff; }

  textarea { width: 100%; background: var(--card2); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; padding: 10px 12px; resize: none; font-family: inherit; min-height: 80px; }
  textarea:focus { outline: none; border-color: var(--accent2); }

  .save-btn { width: 100%; background: var(--accent); color: #111; font-weight: 800; font-size: 16px; padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin-top: 8px; }
  .save-btn:hover { background: #d4eb3a; }

  /* ── Adjustment notice ── */
  .adj-notice { margin: 0 16px 12px; background: #1e2010; border: 1px solid #4a5a20; border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .adj-notice .adj-icon { font-size: 18px; flex-shrink: 0; }
  .adj-notice .adj-text { font-size: 13px; line-height: 1.5; }
  .adj-notice .adj-text strong { color: var(--accent); }

  /* ── Stats card ── */
  .stats-card { margin: 0 16px 12px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; }
  .stats-row { display: flex; justify-content: space-between; gap: 12px; }
  .stat { text-align: center; flex: 1; }
  .stat .s-val { font-size: 22px; font-weight: 800; color: var(--accent); }
  .stat .s-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── Rest day ── */
  .rest-card { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 32px 20px; text-align: center; }
  .rest-card .rest-icon { font-size: 48px; margin-bottom: 12px; }
  .rest-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .rest-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Wrist alert ── */
  .wrist-alert { margin: 0 16px 12px; background: #1e1510; border: 1px solid #5a3a10; border-radius: 10px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .wrist-alert .wa-icon { font-size: 18px; flex-shrink: 0; }
  .wrist-alert .wa-text { font-size: 13px; line-height: 1.5; color: #ffcc80; }
  .wrist-alert .wa-text strong { color: #ffb347; }

  /* ── Knee red flag ── */
  .red-flag-btn { margin: 0 16px 12px; width: calc(100% - 32px); background: transparent; border: 1.5px solid var(--red-flag); color: var(--red-flag); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .wrist-btn { margin: 0 16px 12px; width: calc(100% - 32px); background: transparent; border: 1.5px solid #5a3a10; color: #ffb347; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* ── Export ── */
  .export-btn { margin: 0 16px; width: calc(100% - 32px); background: var(--card2); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; }

  /* ── Workout analysis ── */
  .upload-zone { margin: 8px 16px 0; }
  .upload-btn { display: block; width: 100%; background: #0d1520; border: 1.5px dashed var(--accent2); color: var(--accent2); border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: all .15s; }
  .upload-btn:hover { background: #131d2e; border-color: #7aa5ff; }
  .analysis-card { margin: 12px 16px 0; background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
  .analysis-header { padding: 12px 16px; background: #0d1520; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .analysis-header h4 { font-size: 14px; font-weight: 700; flex: 1; }
  .analysis-header .a-date { font-size: 11px; color: var(--muted); }
  .analysis-body { padding: 14px 16px; }
  .analysis-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .metric-box { background: var(--card2); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .metric-box .m-val { font-size: 18px; font-weight: 800; color: var(--accent); }
  .metric-box .m-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .metric-box.warning .m-val { color: #ffb347; }
  .metric-box.good .m-val { color: var(--done); }
  .lap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; margin-bottom: 14px; }
  .lap-item { background: var(--card2); border-radius: 8px; padding: 8px 6px; text-align: center; border: 1px solid var(--border); }
  .lap-item .lap-num { font-size: 10px; color: var(--muted); }
  .lap-item .lap-pace { font-size: 14px; font-weight: 700; }
  .lap-item .lap-hr { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .lap-item.fast { border-color: var(--done); }
  .lap-item.slow { border-color: #ffb347; }
  .insight-section { margin-bottom: 10px; }
  .insight-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .insight-title.wins { color: var(--done); }
  .insight-title.watch { color: #ffb347; }
  .insight-title.adjust { color: var(--accent2); }
  .insight-item { font-size: 13px; line-height: 1.5; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .insight-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">Hyrox Plan</div>
      <div class="race-countdown">Race in <span id="daysToRace">–</span> days</div>
    </div>
    <div class="header-date" id="headerDate">–</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
      <div class="header-week" id="headerWeek">–</div>
      <div id="syncStatus" style="font-size:11px;color:var(--muted)"></div>
    </div>
  </div>

  <div class="week-strip" id="weekStrip"></div>
  <div class="pace-bar" id="paceBar"></div>
  <div id="adjNotice"></div>
  <div id="wristAlert"></div>
  <div id="statsCard"></div>
  <div id="sessionArea"></div>
  <div id="analysisArea"></div>

  <div style="height:8px"></div>
  <button class="red-flag-btn" onclick="showRedFlags()">⚠ Knee red flags — know when to stop</button>
  <div style="height:8px"></div>
  <button class="wrist-btn" onclick="showWristMods()">🤚 De Quervain's wrist modifications</button>
  <div style="height:8px"></div>
  <button class="export-btn" onclick="exportFeedback()">↓ Export feedback JSON (for analyze_garmin.py)</button>
  <div style="height:8px"></div>
  <button class="export-btn" id="apiKeyBtn" onclick="promptApiKey()">🔑 Claude API key — screenshot analysis</button>
  <div style="height:8px"></div>
  <button class="export-btn" id="syncBtn" onclick="promptGistSetup()">☁ Auto-sync — tap to set up</button>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="feedbackModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">How did it go?</h3>
    <div class="modal-sub" id="modalSub">–</div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ── Plan data ─────────────────────────────────────────────────────────────────

const RACE_DATE  = new Date('2026-07-05T00:00:00');
const PLAN_START = new Date('2026-05-18T00:00:00');

const PACE_TARGETS = {
  1: { easy: '6:25', tempo: '6:10', intervals: '5:55' },
  2: { easy: '6:12', tempo: '5:57', intervals: '5:42' },
  3: { easy: '6:00', tempo: '5:45', intervals: '5:30' },
  4: { easy: '6:00', tempo: '5:45', intervals: '5:30' },
  5: { easy: '6:00', tempo: '5:45', intervals: '5:30' },
  6: { easy: '6:15', tempo: '6:00', intervals: '5:30' },
};

// Session definitions. paceRef: which pace to highlight today.
// kneePhase: 1/2/3 or 'activation' (pre-run only)
const SESSIONS = {
  // ── WEEK 1 ──
  '2026-05-18': { rest: true, restMsg: 'Plan starts tomorrow. Prep your gym kit and read through Week 1.' },
  '2026-05-19': {
    week: 1, type: 'run', icon: '🏃', title: 'Run A — Reintroduction',
    subtitle: 'First run back. HR governs everything.',
    paceRef: 'easy', kneePhase: 'activation',
    blocks: [
      { title: 'Warm-up', items: ['5 min brisk walk', 'Knee activation (5 min): clamshells ×15 each · TKE ×15 each · glute bridge ×20 · single-leg balance 30s each · lateral band walk ×10 each dir'] },
      { title: 'Main', items: ['3km easy @ [EASY] — HR 132–146 bpm throughout', 'If HR stays below 146: 4 × 100m strides @ ~5:00/km, walk back full recovery', 'STOP if sharp knee pain (dull ache is OK)'] },
      { title: 'Cool-down', items: ['Post-session knee recovery (8 min): quad · hamstring · hip flexor · IT band foam roll · calf stretch'] },
    ],
    note: 'No intervals this week. Week 1 Monday is pure aerobic reintroduction.',
  },
  '2026-05-20': { rest: true, restMsg: 'Rest day. Light walk OK. Do your post-session knee recovery stretches.' },
  '2026-05-21': {
    week: 1, type: 'strength', icon: '🏠', title: 'Strength — Home Session',
    subtitle: 'Knee Block Phase 1 · DBs + bands only · no gym needed',
    kneePhase: 1,
    blocks: [
      { title: 'Warm-up (8 min)', items: ['2 min jumping jacks', 'Band Ski Pull-down ×20 — anchor band overhead (door frame / banister), double-arm pull to hips, hinge throughout · this is the SkiErg pattern'] },
      { title: 'Knee Block — Phase 1 (12 min, 3 rounds)', knee: true, items: ['TKE (band) ×20 each leg · Full lockout, 1s pause', 'Short Arc Quad ×15 each · 30° → full lock, 2s hold', 'Straight Leg Raise ×15 each · 3s lower', 'Clamshell (band) ×20 each side · keep hips stacked', 'Single-leg Balance 45s each · eyes open', 'Heel Slide ×15 each · slide to comfortable end range only'] },
      { title: 'Block A — Posterior Chain (3 rounds, 60s rest)', items: ['DB Goblet Squat 3×12 @ 16–20kg · hold one DB vertically at chest', 'DB Romanian Deadlift 3×10 @ 2×16–20kg · hinge at hip, same movement as barbell RDL', 'Step-up to chair / couch / stairs 3×10 each · add one 8–10kg DB if bodyweight feels easy', 'Copenhagen Plank 3×20s each · rest top foot on chair seat'] },
      { title: 'Block B — Cardio + Core (3 rounds, 90s rest)', items: ['Band Ski Pull-down 2×20 reps — anchor high, double-arm pull to hips · right wrist: hook grip, no thumb wrap', 'DB Farmers Walk 50m @ 2×20–22kg · walk the length of your space and back · right wrist: use strap looped through handle', 'Hollow Body Hold 30s · lower back pressed flat, arms overhead'] },
      { title: 'Station Practice', items: ['Burpee Broad Jumps: 4 sets × 10 · chest-to-floor → explosive jump forward → soft-knee landing · right hand: fist position on floor'] },
      { title: 'Cool-down', items: ['Full knee recovery protocol (8 min)'] },

    note: 'From Week 2 onward you\'ll be at the gym. This week: same stimulus, different tools.',
  },
  '2026-05-22': { rest: true, restMsg: 'Rest day.' },
  '2026-05-23': {
    week: 1, type: 'run', icon: '🏃', title: 'Run B — Easy Aerobic',
    subtitle: 'HR-governed easy run. Build time on feet.',
    paceRef: 'easy', kneePhase: 'activation',
    blocks: [
      { title: 'Warm-up', items: ['5 min walk', 'Knee activation (5 min) · same as Monday'] },
      { title: 'Main', items: ['4km continuous @ [EASY] · HR 132–146 bpm', 'If HR stayed in Z2: 4 × 200m @ 5:20/km, 90s rest', 'HR is the governor — not your legs\' feel'] },
      { title: 'Cool-down', items: ['Knee recovery protocol (8 min): hip flexor lunge 90s each · IT band foam roll 60s each · calf stretch on step 60s each'] },
    ],
  },
  '2026-05-24': {
    week: 1, type: 'sim', icon: '🏠', title: 'Saturday — Combined Intro (Home)',
    subtitle: 'Run → Station. All three stations work without a gym.',
    paceRef: 'easy', kneePhase: 'activation',
    blocks: [
      { title: 'Warm-up (15 min)', items: ['Easy 1km jog', 'Knee activation (5 min)', 'Dynamic drills: leg swings · hip circles · A-skips'] },
      { title: 'Main — 3 rounds, 3 min rest between · transition ≤30s', items: ['Round 1: 500m @ 5:40/km → Band Ski Pull-down 3×20 reps (anchor band overhead) · right wrist: hook grip only', 'Round 2: 500m @ 5:40/km → 12 Burpee Broad Jumps · right hand fist position on floor', 'Round 3: 500m @ 5:40/km → DB Farmers Walk 50m @ 2×20kg · right wrist strap'] },
      { title: 'Cool-down', items: ['Easy 500m jog · full knee recovery protocol'] },
    ],
    note: 'Technique focus, not pace. The run→station habit is what matters this week. Band pull-downs teach the SkiErg movement pattern before you\'re at the gym.',
  },

  // ── WEEK 2 ──
  '2026-05-25': { rest: true, restMsg: 'Rest day. Well done on Week 1.' },
  '2026-05-26': {
    week: 2, type: 'run', icon: '🏃', title: 'Run A — Volume Build',
    subtitle: 'More km, first intervals.',
    paceRef: 'intervals', kneePhase: 'activation',
    blocks: [
      { title: 'Warm-up', items: ['5 min walk · Knee activation (5 min) · Dynamic drills'] },
      { title: 'Main', items: ['5km easy run @ [EASY]', 'Then: 6 × 300m @ [INTERVALS], 90s rest between'] },
      { title: 'Cool-down', items: ['Knee recovery protocol'] },
    ],
  },
  '2026-05-27': { rest: true, restMsg: 'Rest day.' },
  '2026-05-28': {
    week: 2, type: 'strength', icon: '💪', title: 'Strength + Stations',
    subtitle: 'Knee Block Phase 1 · Sled intro · Rowing intro',
    kneePhase: 1,
    blocks: [
      { title: 'Warm-up', items: ['500m SkiErg easy'] },

// ── State management ──────────────────────────────────────────────────────────

function loadState() {
  try { return JSON.parse(localStorage.getItem('hyrox_state') || '{}'); } catch { return {}; }
}
function saveState(s) { localStorage.setItem('hyrox_state', JSON.stringify(s)); syncToCloud(); }

let state = loadState();
// state = { completions: {dateStr: 'done'|'skipped'}, feedback: {dateStr: {...}}, paceAdj: {week: seconds} }
if (!state.completions)  state.completions  = {};
if (!state.feedback)     state.feedback     = {};
if (!state.paceAdj)      state.paceAdj      = {};
if (!state.workoutData)  state.workoutData  = {};

// ── Helpers ───────────────────────────────────────────────────────────────────

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function today() { return dateKey(new Date()); }
function getWeekNum(dateStr) {
  const d = new Date(dateStr);
  const diff = Math.floor((d - PLAN_START) / 86400000);
  return Math.max(1, Math.min(6, Math.floor(diff / 7) + 1));
}
function daysToRace() {
  const diff = Math.ceil((RACE_DATE - new Date()) / 86400000);
  return Math.max(0, diff);
}
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}
function adjustedPace(week, key, addSecs) {
  const base = PACE_TARGETS[week]?.[key];
  if (!base) return '–';
  const adj = (state.paceAdj[week] || 0) + (addSecs || 0);
  const [m, s] = base.split(':').map(Number);
  const total = Math.max(180, m * 60 + s + adj);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}
function injectPace(text, week) {
  return text
    .replace(/\[EASY\]/g,      `<span class="pace-inline">${adjustedPace(week, 'easy')}/km</span>`)
    .replace(/\[TEMPO\]/g,     `<span class="pace-inline">${adjustedPace(week, 'tempo')}/km</span>`)
    .replace(/\[INTERVALS\]/g, `<span class="pace-inline">${adjustedPace(week, 'intervals')}/km</span>`);
}

// ── Pace adjustment engine ────────────────────────────────────────────────────

function recomputePaceAdj(week) {
  const weekFeedback = Object.entries(state.feedback)
    .filter(([k]) => {
      const s = SESSIONS[k];
      return s && s.week === week && s.type === 'run';
    })
    .map(([, v]) => v.pace_feel || 0);

  if (weekFeedback.length < 2) return;
  const avg = weekFeedback.reduce((a, b) => a + b, 0) / weekFeedback.length;
  // avg < -0.5 = consistently easier → adjust paces 5s faster
  // avg > 0.5  = consistently harder  → adjust paces 5–10s slower
  let adj = 0;
  if (avg < -1.0)      adj = -10;
  else if (avg < -0.5) adj = -5;
  else if (avg > 1.0)  adj =  15;
  else if (avg > 0.5)  adj =  10;
  state.paceAdj[week] = adj;
  saveState(state);
}

function renderWeekStrip() {
  // Always show the two-week window that contains today
  const todayWeek = getWeekNum(today());
  const firstWeek = Math.min(todayWeek, 5); // don't start on week 6
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

  for (let w = firstWeek; w <= firstWeek + 1; w++) {
    if (w > 6) break;
    const weekStart = new Date(PLAN_START.getTime() + (w - 1) * 7 * 86400000);
    const weekLabel = w === todayWeek ? 'This week' : w === todayWeek + 1 ? 'Next week' : `Week ${w}`;

    // Week label divider
    strip.innerHTML += `<div class="week-divider"><span>${weekLabel}</span></div>`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart.getTime() + i * 86400000);
      const dk = dateKey(d);
      const s = SESSIONS[dk];
      const isToday = dk === today();
      const isView = dk === viewDate;
      const comp = state.completions[dk];

      let icon = '–';
      let cls = 'rest';
      if (s && !s.rest) {
        icon = s.icon;
        cls = s.type;
        if (comp === 'done')    cls += ' done';
        else if (comp === 'skipped') cls += ' skipped';
      }
      if (isView)  cls += ' active';
      if (isToday) cls += ' today';

      strip.innerHTML += `
        <div class="day-chip ${cls}" onclick="viewDate='${dk}';render()">
          <div class="chip-label">${dayLabels[i]}</div>
          <div class="chip-date">${d.getDate()}</div>
          <div class="chip-icon">${comp === 'done' ? '✓' : comp === 'skipped' ? '✗' : icon}</div>
        </div>`;
    }
  }

  // Scroll so today is visible
  requestAnimationFrame(() => {
    const active = strip.querySelector('.today, .active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  });
}

// ── Garmin workout file parsing ───────────────────────────────────────────────

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const phi1 = lat1 * Math.PI / 180, phi2 = lat2 * Math.PI / 180;
  const dphi = (lat2 - lat1) * Math.PI / 180;
  const dlam = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dphi/2)**2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dlam/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function parseTCX(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const laps = [];
  doc.querySelectorAll('Lap').forEach(lap => {
    const secs   = parseFloat(lap.querySelector('TotalTimeSeconds')?.textContent || 0);
    const distM  = parseFloat(lap.querySelector('DistanceMeters')?.textContent || 0);
    const avgHR  = parseInt(lap.querySelector('AverageHeartRateBpm Value')?.textContent || 0);
    const maxHR  = parseInt(lap.querySelector('MaximumHeartRateBpm Value')?.textContent || 0);
    if (distM > 50 && secs > 0) {
      laps.push({ distM, totalTimeSec: secs, paceSecPerKm: (secs / distM) * 1000, avgHR, maxHR });
    }
  });
  return laps.length ? laps : null;
}

function parseGPX(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const pts = doc.querySelectorAll('trkpt');
  if (pts.length < 2) return null;

  const points = [];
  pts.forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const timeStr = pt.querySelector('time')?.textContent;
    // HR can live in extensions under gpxtpx:hr or ns3:hr
    const hrEl = pt.querySelector('hr') || pt.querySelector('HeartRateBpm Value');
    const hr = parseInt(hrEl?.textContent || 0);
    if (!isNaN(lat) && !isNaN(lon) && timeStr) {
      points.push({ lat, lon, time: new Date(timeStr), hr });
    }
  });
  if (points.length < 2) return null;

  const laps = [];
  let lapDist = 0, lapStart = 0, lapHRs = [];
  for (let i = 1; i < points.length; i++) {
    const d = haversine(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
    lapDist += d;
    if (points[i].hr > 0) lapHRs.push(points[i].hr);
    if (lapDist >= 1000 || i === points.length - 1) {
      const secs = (points[i].time - points[lapStart].time) / 1000;
      const avgHR = lapHRs.length ? Math.round(lapHRs.reduce((a,b) => a+b) / lapHRs.length) : 0;
      laps.push({ distM: lapDist, totalTimeSec: secs, paceSecPerKm: (secs / lapDist) * 1000, avgHR, maxHR: Math.max(0, ...lapHRs) });
      lapDist = 0; lapStart = i; lapHRs = [];
    }
  }
  return laps.length ? laps : null;
}

function secToPace(s) {
  if (!s || s <= 0) return '–';
  return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
}

function analyzeWorkout(laps, dk) {
  if (!laps || !laps.length) return null;
  const session  = SESSIONS[dk];
  const week     = session?.week || getWeekNum(dk);
  const totalDist = laps.reduce((a, l) => a + l.distM, 0);
  const totalTime = laps.reduce((a, l) => a + l.totalTimeSec, 0);
  const avgPaceSec = totalDist > 0 ? (totalTime / totalDist) * 1000 : 0;
  const hrList = laps.filter(l => l.avgHR > 0).map(l => l.avgHR);
  const avgHR  = hrList.length ? Math.round(hrList.reduce((a,b) => a+b) / hrList.length) : 0;

  const wins = [], watch = [], adjustments = [];

  // ── Pace vs plan ──
  const paceRef = session?.paceRef || 'easy';
  const planned = adjustedPace(week, paceRef);
  const [pm, ps] = planned.split(':').map(Number);
  const plannedSec = pm * 60 + ps;

  if (plannedSec > 0 && avgPaceSec > 0) {
    const diff = Math.round(avgPaceSec - plannedSec);
    if (Math.abs(diff) <= 15) {
      wins.push(`Pace bang on target: ${secToPace(avgPaceSec)}/km vs planned ${planned}/km.`);
    } else if (diff < -30) {
      watch.push(`Ran ${Math.abs(diff)}s/km faster than planned (${secToPace(avgPaceSec)}/km). Check HR data — don't burn aerobic matches this early.`);
      adjustments.push(`Next easy run: hold back ${Math.round(Math.abs(diff)/2)}s/km for the first 2 km, then settle.`);
    } else if (diff < -15) {
      watch.push(`Slightly faster than target (${secToPace(avgPaceSec)}/km vs ${planned}/km). Fine if HR stayed in Z2.`);
    } else if (diff > 30) {
      watch.push(`Ran ${diff}s/km slower than target (${secToPace(avgPaceSec)}/km). Normal in early weeks — aerobic base is building.`);
    } else {
      wins.push(`Great pacing restraint: ${secToPace(avgPaceSec)}/km. Building the base correctly.`);
    }
  }

  // ── HR zones ──
  if (avgHR > 0) {
    if (avgHR <= 132) {
      wins.push(`HR very controlled: avg ${avgHR} bpm (Zone 1). Can nudge pace 5–10s/km faster next run.`);
    } else if (avgHR <= 146) {
      wins.push(`HR perfectly in Zone 2: avg ${avgHR} bpm. This is the aerobic sweet spot.`);
    } else if (avgHR <= 160) {
      watch.push(`HR drifted into Zone 3: avg ${avgHR} bpm. Ease back 10–15s/km on the next easy run.`);
      if (avgPaceSec > 0) adjustments.push(`Adjust easy pace to ${secToPace(avgPaceSec + 15)}/km until HR stays below 146 bpm.`);
      state.paceAdj[week] = Math.max(state.paceAdj[week] || 0, 15);
      saveState(state);
    } else {
      watch.push(`HR too high for easy session: avg ${avgHR} bpm (Zone 4). This run was tempo intensity, not aerobic base work.`);
      if (avgPaceSec > 0) adjustments.push(`Drop easy pace to ${secToPace(avgPaceSec + 25)}/km. Stop if HR exceeds 150 bpm.`);
      state.paceAdj[week] = Math.max(state.paceAdj[week] || 0, 20);
      saveState(state);
    }
  }

  // ── Pacing consistency ──
  if (laps.length >= 3) {
    const mid = Math.floor(laps.length / 2);
    const firstAvg = laps.slice(0, mid).reduce((a,l) => a + l.paceSecPerKm, 0) / mid;
    const lastAvg  = laps.slice(mid).reduce((a,l) => a + l.paceSecPerKm, 0) / (laps.length - mid);
    const fade = Math.round(lastAvg - firstAvg);
    if (fade > 25) {
      watch.push(`Pace fade of ${fade}s/km in the second half. Try starting ${Math.round(fade/2)}s/km slower next time.`);
    } else if (fade < -15) {
      wins.push(`Negative split! Second half was ${Math.abs(fade)}s/km faster — excellent pacing discipline.`);
    } else {
      wins.push(`Even pacing across ${laps.length} km — consistent effort throughout.`);
    }
  }

  // ── Volume ──
  const km = (totalDist / 1000).toFixed(1);
  if (parseFloat(km) >= 4 && session?.type === 'run') wins.push(`Good volume: ${km} km completed.`);

  if (!wins.length && !watch.length) wins.push(`Session complete: ${km} km in ${Math.floor(totalTime/60)} min.`);

  return { laps, avgPaceSec, avgHR, totalDist, totalTime, wins, watch, adjustments };
}

  if (!existing) {
    const hasKey = !!getApiKey();
    el.innerHTML = `

  const { laps, avgPaceSec, avgHR, totalDist, totalTime, wins, watch, adjustments } = existing;
  const week = session?.week || getWeekNum(viewDate);
  const paceRef = session?.paceRef || 'easy';
  const planned = adjustedPace(week, paceRef);
  const [pm, ps] = planned.split(':').map(Number);
  const plannedSec = pm * 60 + ps;

  const paceClass = avgPaceSec > 0 ? (Math.abs(avgPaceSec - plannedSec) <= 20 ? 'good' : avgPaceSec - plannedSec > 30 ? '' : 'good') : '';
  const hrClass   = avgHR > 0 ? (avgHR <= 146 ? 'good' : 'warning') : '';

  const lapsHtml = laps.map((l, i) => {
    const diff = plannedSec > 0 ? l.paceSecPerKm - plannedSec : 0;
    const cls = diff < -15 ? 'fast' : diff > 30 ? 'slow' : '';
    return `<div class="lap-item ${cls}">
      <div class="lap-num">km ${i+1}</div>
      <div class="lap-pace">${secToPace(l.paceSecPerKm)}</div>
      ${l.avgHR > 0 ? `<div class="lap-hr">${l.avgHR} bpm</div>` : ''}
    </div>`;
  }).join('');

  const winsHtml = wins.length ? `<div class="insight-section">
    <div class="insight-title wins">✓ What went well</div>
    ${wins.map(w => `<div class="insight-item">${w}</div>`).join('')}
  </div>` : '';

  const watchHtml = watch.length ? `<div class="insight-section">
    <div class="insight-title watch">⚠ Things to watch</div>
    ${watch.map(w => `<div class="insight-item">${w}</div>`).join('')}
  </div>` : '';

  const adjHtml = adjustments.length ? `<div class="insight-section">
    <div class="insight-title adjust">→ Adjustments for next session</div>
    ${adjustments.map(a => `<div class="insight-item">${a}</div>`).join('')}
  </div>` : '';

  el.innerHTML = `
    <div class="analysis-card">
      <div class="analysis-header">
        <span>📊</span>
        <h4>Workout Analysis</h4>
        <span class="a-date">${new Date(viewDate + 'T00:00:00').toLocaleDateString('en-AU', {day:'numeric',month:'short'})}</span>
      </div>
      <div class="analysis-body">
        <div class="analysis-metrics">
          <div class="metric-box ${paceClass}">
            <div class="m-val">${secToPace(avgPaceSec)}</div>
            <div class="m-label">Avg pace</div>
          </div>
          <div class="metric-box ${hrClass}">
            <div class="m-val">${avgHR > 0 ? avgHR : '–'}</div>
            <div class="m-label">Avg HR bpm</div>
          </div>
          <div class="metric-box">
            <div class="m-val">${(totalDist/1000).toFixed(1)}</div>
            <div class="m-label">km</div>
          </div>
        </div>
        ${laps.length > 1 ? `<div class="lap-grid">${lapsHtml}</div>` : ''}
        ${winsHtml}${watchHtml}${adjHtml}
        <div style="text-align:right;margin-top:6px">
          <label for="garminFileReplace" style="font-size:12px;color:var(--muted);cursor:pointer">↺ Replace file or screenshot</label>
          <input type="file" id="garminFileReplace" accept=".gpx,.tcx,image/*" style="display:none"
            onchange="handleWorkoutFile(this.files[0], '${viewDate}')">
        </div>
      </div>
    </div>`;
}

async function handleWorkoutFile(file, dk) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const isImage = file.type.startsWith('image/') || ['jpg','jpeg','png','webp','heic','heif'].includes(ext);
  if (isImage) { await handleScreenshotFile(file, dk); return; }

  const text = await file.text();
  const laps = ext === 'tcx' ? parseTCX(text) : ext === 'gpx' ? parseGPX(text) : null;
  if (!laps || !laps.length) {
    alert('Could not read the file. Make sure it\'s a GPX or TCX export from Garmin Connect.');
    return;
  }
  const analysis = analyzeWorkout(laps, dk);
  if (!analysis) return;
  state.workoutData[dk] = analysis;
  if (!state.completions[dk]) state.completions[dk] = 'done';
  saveState(state);
  render();
}

// ── Claude API key management ─────────────────────────────────────────────────

function getApiKey() { return localStorage.getItem('hyrox_claude_key') || ''; }
function setApiKey(k) { localStorage.setItem('hyrox_claude_key', k.trim()); }

function promptApiKey() {

        value="${existing}">

// ── Screenshot analysis ───────────────────────────────────────────────────────

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callClaudeVision(base64, mimeType, apiKey) {
  const prompt = `This is a Garmin fitness activity screenshot. Extract every visible workout metric and return ONLY a JSON object — no prose, no markdown fences.

Required format:
{
  "total_distance_km": <number or null>,
  "total_time_seconds": <number or null>,
  "avg_pace_sec_per_km": <number or null>,
  "avg_hr_bpm": <number or null>,
  "max_hr_bpm": <number or null>,
  "calories": <number or null>,
  "laps": [
    { "km": <lap number>, "pace_sec_per_km": <number or null>, "avg_hr": <number or null> }
  ]
}

Conversion rules:
- Pace MM:SS/km → total seconds (5:30 = 330, 6:15 = 375)
- Time H:MM:SS or MM:SS → total seconds (28:45 = 1725, 1:02:30 = 3750)
- If a per-km splits table is visible, populate the laps array in order
- If no splits table is visible, return laps as []
- Use null for any value not visible in the screenshot`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: mimeType, data: base64 } },
        { type: 'text', text: prompt },
      ]}],
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${res.status}`);
  }
  const json = await res.json();
  const text = json.content?.[0]?.text || '';
  const match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('No JSON in response — try a clearer screenshot');
  return JSON.parse(match[0]);
}

async function handleScreenshotFile(file, dk) {
  const apiKey = getApiKey();
  if (!apiKey) { promptApiKey(); return; }

  const el = document.getElementById('analysisArea');
  el.innerHTML = `<div style="margin:12px 16px;padding:24px;text-align:center;color:var(--muted);font-size:13px;background:var(--card);border-radius:14px;border:1px solid var(--border)">
    <div style="font-size:24px;margin-bottom:10px">🔍</div>
    Reading screenshot with Claude vision…
  </div>`;

  try {
    const base64   = await fileToBase64(file);
    const mimeType = file.type || 'image/jpeg';
    const data     = await callClaudeVision(base64, mimeType, apiKey);

    // Build laps array
    let laps = [];
    if (data.laps && data.laps.length > 0) {
      laps = data.laps
        .filter(l => l.pace_sec_per_km > 0)
        .map(l => ({
          distM: 1000,
          totalTimeSec: l.pace_sec_per_km,
          paceSecPerKm: l.pace_sec_per_km,
          avgHR: l.avg_hr || 0,
          maxHR: 0,
        }));
    }

    // Fall back to totals if no lap data
    if (!laps.length && data.avg_pace_sec_per_km) {
      const distM   = (data.total_distance_km || 1) * 1000;
      const timeSec = data.total_time_seconds || data.avg_pace_sec_per_km * (data.total_distance_km || 1);
      laps = [{ distM, totalTimeSec: timeSec, paceSecPerKm: data.avg_pace_sec_per_km, avgHR: data.avg_hr_bpm || 0, maxHR: data.max_hr_bpm || 0 }];
    }

    if (!laps.length) {
      el.innerHTML = `<div style="margin:12px 16px;padding:16px;background:#2a1010;border-radius:12px;font-size:13px;color:#ff9999;line-height:1.6">
        Could not extract workout data from that screenshot. Try a screen showing the main activity summary (pace, HR, distance), or use a GPX/TCX file instead.
      </div>`;
      return;
    }

    const analysis = analyzeWorkout(laps, dk);
    if (!analysis) return;
    analysis.fromScreenshot = true;
    state.workoutData[dk] = analysis;
    if (!state.completions[dk]) state.completions[dk] = 'done';
    saveState(state);
    render();

  } catch (err) {
    el.innerHTML = `<div style="margin:12px 16px;padding:16px;background:#2a1010;border-radius:12px;font-size:13px;color:#ff9999;line-height:1.6">
      ${err.message}<br><br>
      <button onclick="promptApiKey()" style="color:var(--accent2);background:none;border:none;cursor:pointer;font-size:13px;padding:0">Update API key →</button>
    </div>`;
  }
}

function exportFeedback() {
  const data = {
    exported: new Date().toISOString(),
    pace_adjustments: state.paceAdj,
    sessions: Object.values(state.feedback),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

}

// ── Cloud sync (GitHub Gist) ──────────────────────────────────────────────────

function getGistToken() { return localStorage.getItem('hyrox_gist_token') || ''; }
function setGistToken(t) { localStorage.setItem('hyrox_gist_token', t); }
function getGistId()    { return localStorage.getItem('hyrox_gist_id')    || ''; }
function setGistId(id)  { localStorage.setItem('hyrox_gist_id', id); }

const GIST_FILE = 'hyrox-training-state.json';
let _syncTimer = null;

function setSyncStatus(s) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = { syncing: ['☁ Syncing…', 'var(--muted)'], ok: ['☁ Synced ✓', 'var(--done)'], error: ['⚠ Sync failed', '#ffb347'], idle: ['', ''] };
  const [text, color] = map[s] || map.idle;
  el.textContent = text; el.style.color = color;
  if (s === 'ok') setTimeout(() => setSyncStatus('idle'), 3000);
}

function mergeStates(local, remote) {
  const merged = {
    completions: { ...local.completions },
    feedback:    { ...local.feedback,    ...remote.feedback    },
    paceAdj:     { ...local.paceAdj,     ...remote.paceAdj     },
    workoutData: { ...local.workoutData, ...remote.workoutData },
  };
  Object.keys(remote.completions || {}).forEach(k => {
    if (!merged.completions[k] || merged.completions[k] !== 'done')
      merged.completions[k] = remote.completions[k];
  });
  return merged;
}

function gistHeaders(token) {
  return { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' };
}

async function createGist(token) {
  const res = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: gistHeaders(token),
    body: JSON.stringify({ description: 'Hyrox Training Dashboard sync', public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(state) } } }),
  });
  if (!res.ok) { const e = await res.json().catch(()=>{}); throw new Error(e?.message || `GitHub ${res.status}`); }
  return (await res.json()).id;
}

async function pushToGist(token, gistId) {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    method: 'PATCH',
    headers: gistHeaders(token),
    body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(state) } } }),
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}`);
}

async function fetchFromGist(token, gistId) {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: gistHeaders(token) });
  if (!res.ok) throw new Error(`GitHub ${res.status}`);
  const raw = (await res.json()).files?.[GIST_FILE]?.content;
  if (!raw) throw new Error('State file missing from Gist');
  return JSON.parse(raw);
}

function syncToCloud() {
  const token = getGistToken(), gistId = getGistId();
  if (!token || !gistId) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    setSyncStatus('syncing');
    try { await pushToGist(token, gistId); setSyncStatus('ok'); }
    catch { setSyncStatus('error'); }
  }, 2000);
}

async function syncFromCloud() {
  const token = getGistToken(), gistId = getGistId();
  if (!token || !gistId) return;
  setSyncStatus('syncing');
  try {
    const remote = await fetchFromGist(token, gistId);
    const merged = mergeStates(state, remote);
    Object.assign(state, merged);
    localStorage.setItem('hyrox_state', JSON.stringify(state));
    setSyncStatus('ok');
    render();
  } catch { setSyncStatus('error'); }
}

function promptGistSetup() {
  const active = !!(getGistToken() && getGistId());
  document.getElementById('modalTitle').textContent = '☁ Auto-sync setup';
  document.getElementById('modalSub').textContent = 'Private GitHub Gist · free · phone ↔ laptop, automatic';
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.7">
      Your training data will sync automatically every time you log a session. One-time setup:
      <ol style="margin-top:8px;padding-left:18px;display:flex;flex-direction:column;gap:5px">
        <li>Go to <strong style="color:var(--text)">github.com → Settings → Developer settings → Personal access tokens → Tokens (classic)</strong></li>
        <li>Generate new token (classic) → tick <strong style="color:var(--text)">gist</strong> scope only</li>
        <li>Paste the token below</li>
      </ol>
    </div>
    <div class="q-block">
      <span class="q-label">GitHub Personal Access Token</span>
      <input id="gistTokenInput" type="password" placeholder="ghp_…"
        style="width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;padding:10px 12px;font-family:monospace;outline:none"
        value="${getGistToken()}">
    </div>
    ${active ? `<div style="font-size:12px;color:var(--done);margin-bottom:12px">✓ Sync active — Gist ${getGistId().slice(0,8)}…</div>` : ''}
    <button class="save-btn" id="gistSaveBtn" onclick="saveGistToken()">${active ? 'Update token' : 'Connect & start syncing'}</button>`;
  document.getElementById('feedbackModal').classList.add('open');
  setTimeout(() => document.getElementById('gistTokenInput')?.focus(), 100);
}

async function saveGistToken() {
  const token = (document.getElementById('gistTokenInput')?.value || '').trim();
  if (!token) { alert('Please paste your GitHub token.'); return; }
  if (!token.startsWith('ghp_') && !token.startsWith('github_pat_'))
    { alert('Doesn\'t look like a GitHub token (should start with ghp_ or github_pat_).'); return; }
  const btn = document.getElementById('gistSaveBtn');
  btn.textContent = 'Connecting…'; btn.disabled = true;
  try {
    setGistToken(token);
    let gistId = getGistId();
    if (!gistId) { gistId = await createGist(token); setGistId(gistId); }
    else await pushToGist(token, gistId);
    const syncBtn = document.getElementById('syncBtn');
    syncBtn.textContent = '☁ Auto-sync — active ✓';
    syncBtn.style.color = 'var(--done)';
    closeModal();
    setSyncStatus('ok');
  } catch (e) {
    btn.textContent = 'Connect & start syncing'; btn.disabled = false;
    alert(`Connection failed: ${e.message}\n\nCheck the token has "gist" scope and hasn't expired.`);
  }
}

// ── Close modal on overlay click ──────────────────────────────────────────────

document.getElementById('feedbackModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────

if (getApiKey()) document.getElementById('apiKeyBtn').textContent = '🔑 Claude API key — ✓ saved';
if (getGistToken() && getGistId()) {
  document.getElementById('syncBtn').textContent = '☁ Auto-sync — active ✓';
  document.getElementById('syncBtn').style.color = 'var(--done)';
}
render();
syncFromCloud();
</script>
