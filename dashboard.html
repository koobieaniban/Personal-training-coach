<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hyrox Training · July 5</title>
<style>
  :root {
    --bg:        #0f1117;
    --card:      #1a1d26;
    --card2:     #22263a;
    --accent:    #e8ff47;
    --accent2:   #5b8fff;
    --text:      #f0f0ef;
    --muted:     #7a7f94;
    --done:      #4cdd82;
    --skipped:   #ff6b6b;
    --border:    #2c3048;
    --red-flag:  #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; min-height: 100vh; }

  /* ── Layout ── */
  .app { max-width: 500px; margin: 0 auto; padding: 0 0 120px; }

  /* ── Header ── */
  .header { padding: 20px 16px 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
  .race-countdown { font-size: 13px; color: var(--muted); }
  .race-countdown span { color: var(--accent); font-weight: 700; }
  .header-date { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .header-week { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── Week strip ── */
  .week-strip { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
  .week-strip::-webkit-scrollbar { display: none; }
  .week-divider { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 2px; }
  .week-divider span { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; writing-mode: vertical-rl; }
  .day-chip { flex-shrink: 0; width: 48px; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); transition: all .15s; }
  .day-chip .chip-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .day-chip .chip-date { font-size: 13px; font-weight: 700; }
  .day-chip .chip-icon { font-size: 15px; margin-top: 3px; }
  .day-chip.active { border-color: var(--accent); background: #1e2510; }
  .day-chip.today { border-color: var(--accent2); }
  .day-chip.done { border-color: var(--done); background: #0d2018; }
  .day-chip.skipped { border-color: var(--skipped); opacity: .6; }
  .day-chip.rest { opacity: .5; }

  /* ── Pace targets bar ── */
  .pace-bar { display: flex; gap: 6px; padding: 0 16px 12px; }
  .pace-pill { flex: 1; background: var(--card); border-radius: 8px; padding: 8px 10px; text-align: center; border: 1px solid var(--border); }
  .pace-pill .p-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pace-pill .p-val { font-size: 17px; font-weight: 800; color: var(--accent); }
  .pace-pill.adjusted .p-val { color: #ffb347; }
  .pace-pill .p-adj { font-size: 10px; color: #ffb347; }

  /* ── Session card ── */
  .session-card { margin: 0 16px 12px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
  .session-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .session-type-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .type-run    { background: #1a2e10; }
  .type-strength { background: #1a1a2e; }
  .type-sim    { background: #2e1a1a; }
  .type-rest   { background: #1a1a1a; }
  .session-title { flex: 1; }
  .session-title h2 { font-size: 16px; font-weight: 700; }
  .session-title .session-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .status-pending  { background: #2a2a3a; color: var(--muted); }
  .status-done     { background: #0d2018; color: var(--done); }
  .status-skipped  { background: #2a0f0f; color: var(--skipped); }

  /* ── Blocks ── */
  .session-body { padding: 0 16px 16px; }
  .block { margin-bottom: 14px; }
  .block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .block-title.knee-title { color: #7fb3ff; }
  .block-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 14px; line-height: 1.45; }
  .block-item::before { content: '·'; color: var(--muted); flex-shrink: 0; }
  .pace-inline { color: var(--accent); font-weight: 700; }
  .knee-note { background: #0d1829; border: 1px solid #1e3a5a; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #8bb8ff; line-height: 1.5; margin-top: 4px; }

  /* ── Complete / Skip buttons ── */
  .action-bar { display: flex; gap: 8px; padding: 14px 16px 0; border-top: 1px solid var(--border); }
  .btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all .15s; }
  .btn-complete { background: var(--accent); color: #111; }
  .btn-complete:hover { background: #d4eb3a; }
  .btn-skip { background: var(--card2); color: var(--muted); border: 1px solid var(--border); }
  .btn-skip:hover { color: var(--skipped); border-color: var(--skipped); }
  .btn-undo { background: var(--card2); color: var(--muted); border: 1px solid var(--border); font-size: 13px; }
  .btn-feedback { background: var(--accent2); color: #fff; }
  .btn-full { width: 100%; flex: unset; }

  /* ── Feedback modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform .25s cubic-bezier(.32,0,.67,0); }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .modal-close { position: absolute; right: 20px; top: 20px; background: var(--card2); border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; }

  .q-block { margin-bottom: 20px; }
  .q-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: .05em; }

  .feel-row { display: flex; gap: 6px; }
  .feel-btn { flex: 1; padding: 10px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; text-align: center; transition: all .15s; }
  .feel-btn .feel-emoji { font-size: 22px; display: block; }
  .feel-btn .feel-label { font-size: 10px; color: var(--muted); margin-top: 3px; display: block; }
  .feel-btn.selected { border-color: var(--accent); background: #1e2510; }
  .feel-btn.selected .feel-label { color: var(--accent); }

  .pace-feel-row { display: flex; flex-direction: column; gap: 6px; }
  .pace-opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; font-size: 14px; transition: all .15s; }
  .pace-opt input { accent-color: var(--accent); width: 16px; height: 16px; }
  .pace-opt.selected { border-color: var(--accent); background: #1e2510; }

  .knee-scale { display: flex; gap: 6px; }
  .knee-btn { flex: 1; padding: 10px 4px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); cursor: pointer; text-align: center; font-size: 13px; font-weight: 700; transition: all .15s; }
  .knee-btn.selected { border-color: #5b8fff; background: #0d1829; color: #5b8fff; }

  textarea { width: 100%; background: var(--card2); border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; padding: 10px 12px; resize: none; font-family: inherit; min-height: 80px; }
  textarea:focus { outline: none; border-color: var(--accent2); }

  .save-btn { width: 100%; background: var(--accent); color: #111; font-weight: 800; font-size: 16px; padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin-top: 8px; }
  .save-btn:hover { background: #d4eb3a; }

  /* ── Adjustment notice ── */
  .adj-notice { margin: 0 16px 12px; background: #1e2010; border: 1px solid #4a5a20; border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .adj-notice .adj-icon { font-size: 18px; flex-shrink: 0; }
  .adj-notice .adj-text { font-size: 13px; line-height: 1.5; }
  .adj-notice .adj-text strong { color: var(--accent); }

  /* ── Stats card ── */
  .stats-card { margin: 0 16px 12px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; }
  .stats-row { display: flex; justify-content: space-between; gap: 12px; }
  .stat { text-align: center; flex: 1; }
  .stat .s-val { font-size: 22px; font-weight: 800; color: var(--accent); }
  .stat .s-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── Rest day ── */
  .rest-card { margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 32px 20px; text-align: center; }
  .rest-card .rest-icon { font-size: 48px; margin-bottom: 12px; }
  .rest-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .rest-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Wrist alert ── */
  .wrist-alert { margin: 0 16px 12px; background: #1e1510; border: 1px solid #5a3a10; border-radius: 10px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
  .wrist-alert .wa-icon { font-size: 18px; flex-shrink: 0; }
  .wrist-alert .wa-text { font-size: 13px; line-height: 1.5; color: #ffcc80; }
  .wrist-alert .wa-text strong { color: #ffb347; }

  /* ── Knee red flag ── */
  .red-flag-btn { margin: 0 16px 12px; width: calc(100% - 32px); background: transparent; border: 1.5px solid var(--red-flag); color: var(--red-flag); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .wrist-btn { margin: 0 16px 12px; width: calc(100% - 32px); background: transparent; border: 1.5px solid #5a3a10; color: #ffb347; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* ── Export ── */
  .export-btn { margin: 0 16px; width: calc(100% - 32px); background: var(--card2); border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 10px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">Hyrox Plan</div>
      <div class="race-countdown">Race in <span id="daysToRace">–</span> days</div>
    </div>
    <div class="header-date" id="headerDate">–</div>
    <div class="header-week" id="headerWeek">–</div>
  </div>

  <div class="week-strip" id="weekStrip"></div>
  <div class="pace-bar" id="paceBar"></div>
  <div id="adjNotice"></div>
  <div id="wristAlert"></div>
  <div id="statsCard"></div>
  <div id="sessionArea"></div>

  <div style="height:8px"></div>
  <button class="red-flag-btn" onclick="showRedFlags()">⚠ Knee red flags — know when to stop</button>
  <div style="height:8px"></div>
  <button class="wrist-btn" onclick="showWristMods()">🤚 De Quervain's wrist modifications</button>
  <div style="height:8px"></div>
  <button class="export-btn" onclick="exportFeedback()">↓ Export feedback JSON (for analyze_garmin.py)</button>
</div>

<!-- Feedback Modal -->
<div class="modal-overlay" id="feedbackModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">How did it go?</h3>
    <div class="modal-sub" id="modalSub">–</div>
    <div id="modalBody"></div>
  </div>
</div>

// ── State management ──────────────────────────────────────────────────────────

function loadState() {
  try { return JSON.parse(localStorage.getItem('hyrox_state') || '{}'); } catch { return {}; }
}
function saveState(s) { localStorage.setItem('hyrox_state', JSON.stringify(s)); }

let state = loadState();
// state = { completions: {dateStr: 'done'|'skipped'}, feedback: {dateStr: {...}}, paceAdj: {week: seconds} }
if (!state.completions) state.completions = {};
if (!state.feedback)    state.feedback    = {};
if (!state.paceAdj)     state.paceAdj     = {};

// ── Helpers ───────────────────────────────────────────────────────────────────

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}
function today() { return dateKey(new Date()); }
function getWeekNum(dateStr) {
  const d = new Date(dateStr);
  const diff = Math.floor((d - PLAN_START) / 86400000);
  return Math.max(1, Math.min(6, Math.floor(diff / 7) + 1));
}
function daysToRace() {
  const diff = Math.ceil((RACE_DATE - new Date()) / 86400000);
  return Math.max(0, diff);
}
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}
function adjustedPace(week, key, addSecs) {
  const base = PACE_TARGETS[week]?.[key];
  if (!base) return '–';
  const adj = (state.paceAdj[week] || 0) + (addSecs || 0);
  const [m, s] = base.split(':').map(Number);
  const total = Math.max(180, m * 60 + s + adj);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}
function injectPace(text, week) {
  return text
    .replace(/\[EASY\]/g,      `<span class="pace-inline">${adjustedPace(week, 'easy')}/km</span>`)
    .replace(/\[TEMPO\]/g,     `<span class="pace-inline">${adjustedPace(week, 'tempo')}/km</span>`)
    .replace(/\[INTERVALS\]/g, `<span class="pace-inline">${adjustedPace(week, 'intervals')}/km</span>`);
}

// ── Pace adjustment engine ────────────────────────────────────────────────────

function recomputePaceAdj(week) {
  const weekFeedback = Object.entries(state.feedback)
    .filter(([k]) => {
      const s = SESSIONS[k];
      return s && s.week === week && s.type === 'run';
    })
    .map(([, v]) => v.pace_feel || 0);

  if (weekFeedback.length < 2) return;
  const avg = weekFeedback.reduce((a, b) => a + b, 0) / weekFeedback.length;
  // avg < -0.5 = consistently easier → adjust paces 5s faster
  // avg > 0.5  = consistently harder  → adjust paces 5–10s slower
  let adj = 0;
  if (avg < -1.0)      adj = -10;
  else if (avg < -0.5) adj = -5;
  else if (avg > 1.0)  adj =  15;
  else if (avg > 0.5)  adj =  10;
  state.paceAdj[week] = adj;
  saveState(state);
}

function renderHeader() {

  document.getElementById('headerDate').textContent = formatDate(viewDate);
  const week = getWeekNum(viewDate);
  const session = SESSIONS[viewDate];
  const wkLabel = session && !session.rest ? `Week ${week} of 6` : `Week ${week} — Rest Day`;
  document.getElementById('headerWeek').textContent = wkLabel;
}

function renderWeekStrip() {
  // Always show the two-week window that contains today
  const todayWeek = getWeekNum(today());
  const firstWeek = Math.min(todayWeek, 5); // don't start on week 6
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

  for (let w = firstWeek; w <= firstWeek + 1; w++) {
    if (w > 6) break;
    const weekStart = new Date(PLAN_START.getTime() + (w - 1) * 7 * 86400000);
    const weekLabel = w === todayWeek ? 'This week' : w === todayWeek + 1 ? 'Next week' : `Week ${w}`;

    // Week label divider
    strip.innerHTML += `<div class="week-divider"><span>${weekLabel}</span></div>`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart.getTime() + i * 86400000);
      const dk = dateKey(d);
      const s = SESSIONS[dk];
      const isToday = dk === today();
      const isView = dk === viewDate;
      const comp = state.completions[dk];

      let icon = '–';
      let cls = 'rest';
      if (s && !s.rest) {
        icon = s.icon;
        cls = s.type;
        if (comp === 'done')    cls += ' done';
        else if (comp === 'skipped') cls += ' skipped';
      }
      if (isView)  cls += ' active';
      if (isToday) cls += ' today';

      strip.innerHTML += `
        <div class="day-chip ${cls}" onclick="viewDate='${dk}';render()">
          <div class="chip-label">${dayLabels[i]}</div>
          <div class="chip-date">${d.getDate()}</div>
          <div class="chip-icon">${comp === 'done' ? '✓' : comp === 'skipped' ? '✗' : icon}</div>
        </div>`;
    }
  }

  // Scroll so today is visible
  requestAnimationFrame(() => {
    const active = strip.querySelector('.today, .active');
    if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  });
}

function renderPaceBar() {
  const session = SESSIONS[viewDate];
  if (!session || session.rest) { document.getElementById('paceBar').innerHTML = ''; return; }
  const week = session.week || getWeekNum(viewDate);
  const adj = state.paceAdj[week] || 0;

  const pills = [
    { label: 'Easy', key: 'easy' },
    { label: 'Tempo', key: 'tempo' },
    { label: 'Intervals', key: 'intervals' },
  ];
  document.getElementById('paceBar').innerHTML = pills.map(p => {
    const isAdj = adj !== 0;
    const adjStr = isAdj ? (adj > 0 ? `+${adj}s slower` : `${Math.abs(adj)}s faster`) : '';
    return `<div class="pace-pill ${isAdj ? 'adjusted' : ''}">
      <div class="p-label">${p.label}</div>
      <div class="p-val">${adjustedPace(week, p.key)}</div>
      ${isAdj && p.key === session.paceRef ? `<div class="p-adj">${adjStr}</div>` : ''}
    </div>`;
  }).join('');
}

function renderAdjNotice() {
  const el = document.getElementById('adjNotice');
  const session = SESSIONS[viewDate];
  if (!session || session.rest) { el.innerHTML = ''; return; }
  const week = session.week || getWeekNum(viewDate);
  const adj = state.paceAdj[week] || 0;
  if (adj === 0) { el.innerHTML = ''; return; }

  const msg = adj < 0
    ? `Based on your recent feedback, this week's pace targets have been bumped <strong>${Math.abs(adj)}s/km faster</strong>. You're adapting well.`
    : `Paces adjusted <strong>${adj}s/km slower</strong> this week based on your feedback. Smart — build the base first.`;
  el.innerHTML = `<div class="adj-notice"><div class="adj-icon">${adj < 0 ? '⚡' : '🔄'}</div><div class="adj-text">${msg}</div></div>`;
}

function renderSession() {
  const session = SESSIONS[viewDate];
  const area = document.getElementById('sessionArea');

  if (!session) {
    area.innerHTML = `<div class="rest-card"><div class="rest-icon">😴</div><h2>Rest Day</h2><p>No session scheduled.</p></div>`;
    return;
  }
  if (session.rest) {
    area.innerHTML = `<div class="rest-card"><div class="rest-icon">😴</div><h2>Rest Day</h2><p>${session.restMsg}</p></div>`;
    return;
  }

  const week = session.week || getWeekNum(viewDate);
  const comp = state.completions[viewDate];
  const hasFeedback = !!state.feedback[viewDate];
  const statusLabel = comp === 'done' ? 'Done ✓' : comp === 'skipped' ? 'Skipped' : 'Pending';
  const statusCls = comp === 'done' ? 'done' : comp === 'skipped' ? 'skipped' : 'pending';

  const blocksHtml = session.blocks.map(b => `
    <div class="block">
      <div class="block-title ${b.knee ? 'knee-title' : ''}">${b.title}</div>
      ${b.knee ? `<div class="knee-note">Full details in <strong>knee-rehab-protocol.md</strong></div>` : ''}
      ${b.items.map(item => `<div class="block-item">${injectPace(item, week)}</div>`).join('')}
    </div>`).join('');

  const noteHtml = session.note ? `<div class="knee-note" style="margin-bottom:14px">💡 ${session.note}</div>` : '';

  let actionHtml = '';
  if (!comp) {
    actionHtml = `<div class="action-bar">
      <button class="btn btn-complete" onclick="markComplete('done')">Mark complete ✓</button>
      <button class="btn btn-skip" onclick="markComplete('skipped')">Skip</button>
    </div>`;
  } else if (comp === 'done' && !hasFeedback) {
    actionHtml = `<div class="action-bar">
      <button class="btn btn-feedback btn-full" onclick="openFeedback()">Log how it felt →</button>
    </div><div style="padding:8px 16px 0"><button class="btn btn-undo btn-full" onclick="undoComplete()">Undo</button></div>`;
  } else if (comp === 'done' && hasFeedback) {
    actionHtml = `<div class="action-bar">
      <button class="btn btn-undo" onclick="openFeedback()">Edit feedback</button>
      <button class="btn btn-undo" onclick="undoComplete()">Undo</button>
    </div>`;
  } else {
    actionHtml = `<div class="action-bar"><button class="btn btn-undo btn-full" onclick="undoComplete()">Undo skip</button></div>`;
  }

  area.innerHTML = `
    <div class="session-card">
      <div class="session-header">
        <div class="session-type-badge type-${session.type}">${session.icon}</div>
        <div class="session-title">
          <h2>${session.title}</h2>
          <div class="session-subtitle">${session.subtitle || ''}</div>
        </div>
        <div class="status-badge status-${statusCls}">${statusLabel}</div>
      </div>
      <div class="session-body">
        ${noteHtml}${blocksHtml}
      </div>
      ${actionHtml}
    </div>`;

  // Stats card
  renderStats();
}

function renderStats() {
  const el = document.getElementById('statsCard');
  const doneCount = Object.values(state.completions).filter(v => v === 'done').length;
  const totalSessions = Object.values(SESSIONS).filter(s => s && !s.rest).length;
  const pct = Math.round(doneCount / totalSessions * 100);

  el.innerHTML = `<div class="stats-card">
    <div class="stats-row">
      <div class="stat"><div class="s-val">${doneCount}</div><div class="s-label">Sessions done</div></div>
      <div class="stat"><div class="s-val">${pct}%</div><div class="s-label">Complete</div></div>
      <div class="stat"><div class="s-val">${daysToRace()}</div><div class="s-label">Days to race</div></div>
    </div>
  </div>`;
}

// ── Complete / Skip ───────────────────────────────────────────────────────────

function markComplete(status) {
  state.completions[viewDate] = status;
  saveState(state);
  render();
  if (status === 'done') setTimeout(openFeedback, 300);
}
function undoComplete() {
  delete state.completions[viewDate];
  delete state.feedback[viewDate];
  saveState(state);
  render();
}

// ── Feedback modal ────────────────────────────────────────────────────────────

function openFeedback() {
  const session = SESSIONS[viewDate];
  if (!session || session.rest) return;
  const week = session.week || getWeekNum(viewDate);
  const existing = state.feedback[viewDate] || {};

  document.getElementById('modalTitle').textContent = 'How did it go?';
  document.getElementById('modalSub').textContent = `${session.title} · ${formatDate(viewDate)}`;

  const isRun = session.type === 'run' || session.type === 'sim';

  const feelOptions = [
    { val: -2, emoji: '😴', label: 'Very easy' },
    { val: -1, emoji: '🙂', label: 'Easy' },
    { val:  0, emoji: '😤', label: 'Just right' },
    { val:  1, emoji: '😰', label: 'Hard' },
    { val:  2, emoji: '🤮', label: 'Too hard' },
  ];
  const feelHtml = feelOptions.map(o => `
    <button class="feel-btn ${existing.overall_feel === o.val ? 'selected' : ''}"
      onclick="selectFeel(this, 'overall_feel', ${o.val})">
      <span class="feel-emoji">${o.emoji}</span>
      <span class="feel-label">${o.label}</span>
    </button>`).join('');

  const paceOptions = [
    { val: -2, label: '⚡ Much easier than expected — push harder next time' },
    { val: -1, label: '👍 Slightly easy — could have gone faster' },
    { val:  0, label: '✅ Right on target — perfect effort' },
    { val:  1, label: '😓 Slightly too hard — had to slow down' },
    { val:  2, label: '🚫 Couldn\'t hit the pace — need to back off' },
  ];
  const paceHtml = isRun ? `
    <div class="q-block">
      <span class="q-label">How did the pace feel?</span>
      <div class="pace-feel-row">
        ${paceOptions.map(o => `
          <label class="pace-opt ${existing.pace_feel === o.val ? 'selected' : ''}"
            onclick="selectPaceFeel(this, ${o.val})">
            <input type="radio" name="pace_feel" ${existing.pace_feel === o.val ? 'checked' : ''}> ${o.label}
          </label>`).join('')}
      </div>
    </div>` : '';

  const kneeNums = [0, 1, 2, 3, 4, 5];
  const kneeHtml = `
    <div class="q-block">
      <span class="q-label">Knee discomfort? (0 = none · 5 = significant pain)</span>
      <div class="knee-scale">
        ${kneeNums.map(n => `<button class="knee-btn ${existing.knee_pain === n ? 'selected' : ''}"
          onclick="selectKnee(this, ${n})">${n}</button>`).join('')}
      </div>
    </div>`;

  document.getElementById('modalBody').innerHTML = `
    <div class="q-block">
      <span class="q-label">Overall effort?</span>
      <div class="feel-row">${feelHtml}</div>
    </div>
    ${paceHtml}
    ${kneeHtml}
    <div class="q-block">
      <span class="q-label">Notes (optional)</span>
      <textarea id="feedbackNotes" placeholder="What went well? Any issues with the knee? Anything to remember for next session…">${existing.notes || ''}</textarea>
    </div>
    <button class="save-btn" onclick="saveFeedback()">Save feedback</button>`;

  document.getElementById('feedbackModal').classList.add('open');
}

function closeModal() {
  document.getElementById('feedbackModal').classList.remove('open');
}

function selectFeel(el, key, val) {
  el.closest('.feel-row').querySelectorAll('.feel-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  el.dataset.key = key;
  el.dataset.val = val;
}

function selectPaceFeel(el, val) {
  el.closest('.pace-feel-row').querySelectorAll('.pace-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  el._val = val;
}

function selectKnee(el, val) {
  el.closest('.knee-scale').querySelectorAll('.knee-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  el._val = val;
}

function saveFeedback() {
  const overall = document.querySelector('.feel-btn.selected');
  const pace = document.querySelector('.pace-opt.selected');
  const knee = document.querySelector('.knee-btn.selected');
  const notes = document.getElementById('feedbackNotes')?.value || '';

  const session = SESSIONS[viewDate];
  const week = session?.week || getWeekNum(viewDate);

  state.feedback[viewDate] = {
    date: viewDate,
    session: session?.title,
    overall_feel: overall ? parseInt(overall.dataset.val) : null,
    pace_feel: pace ? pace._val : null,
    knee_pain: knee ? knee._val : null,
    notes,
    timestamp: new Date().toISOString(),
  };
  saveState(state);
  recomputePaceAdj(week);
  closeModal();
  render();
}

// ── Red flags ─────────────────────────────────────────────────────────────────

function showRedFlags() {
  document.getElementById('modalTitle').textContent = '⚠ Knee Red Flags';
  document.getElementById('modalSub').textContent = 'Stop training immediately if you notice any of these';
  document.getElementById('modalBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      ${[
        'Sharp, stabbing or electric pain inside the joint',
        'Swelling or warmth that persists more than 24 hours',
        'A locking, clicking, or catching sensation under load',
        'Pain that forces you to change your normal running gait',
        'Pain that does not resolve fully overnight',
      ].map(f => `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#2a0f0f;border-radius:8px;font-size:14px"><span style="color:#ff4444;flex-shrink:0">✕</span><span>${f}</span></div>`).join('')}
    </div>
    <div style="background:#1a2e10;border-radius:8px;padding:12px 14px;font-size:13px;color:#4cdd82;line-height:1.6">
      ✓ Muscle soreness and mild aching around the knee after sessions is normal and expected.<br>
      ✓ Joint pain is not. When in doubt, rest and contact your physio.
    </div>`;
  document.getElementById('feedbackModal').classList.add('open');
}

// ── Export ────────────────────────────────────────────────────────────────────

function exportFeedback() {
  const data = {
    exported: new Date().toISOString(),
    pace_adjustments: state.paceAdj,
    sessions: Object.values(state.feedback),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hyrox-feedback-${today()}.json`;
  a.click();
}

// ── Close modal on overlay click ──────────────────────────────────────────────

document.getElementById('feedbackModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Init ──────────────────────────────────────────────────────────────────────

render();
</script>
</body>
</html>
